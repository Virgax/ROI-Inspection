# Corre las pruebas en cada push y en cada pull request.
#
# SOLO prueba. No firma ni publica: eso pondria la clave privada Ed25519 en
# GitHub, que es justo lo que la firma de las cargas existe para evitar
# (docs/HANDOFF_CLAUDE_CODE.md, seccion 5). Publicar se hace en local con
# herramientas/publicar.py.
name: pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # La version de las Mac mini. Probar con otra esconderia justo los
          # fallos de compatibilidad que rompen una estacion (decision 17).
          python-version: "3.9"
      - name: Librerias de sistema para Qt sin pantalla
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dependencias
        run: pip install --no-compile -r requirements-dev.txt
      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
